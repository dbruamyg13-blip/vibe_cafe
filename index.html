<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <p aria-hidden="true">☕</p>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <main>
    <!-- 주문하기와 주문 내역 탭 -->
    <nav class="tabs" role="tablist" aria-label="주문 메뉴">
      <button
        type="button"
        id="order-tab"
        class="tab-button active"
        role="tab"
        aria-selected="true"
        aria-controls="order-panel"
      >☕ 주문하기</button>
      <button
        type="button"
        id="history-tab"
        class="tab-button"
        role="tab"
        aria-selected="false"
        aria-controls="history-panel"
      >📋 주문 내역 <span id="order-count" class="count-badge">0</span></button>
    </nav>

    <section id="order-panel" role="tabpanel" aria-labelledby="order-tab">
      <form id="order-form" novalidate>
        <div>
          <label for="name">이름 (필수)</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div>
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <div>
          <label for="drink">음료 선택</label>
          <select id="drink" name="drink">
            <option value="">-- 음료를 선택하세요 --</option>
            <option value="아메리카노" data-price="3500">아메리카노 3,500원</option>
            <option value="카페라떼" data-price="4000">카페라떼 4,000원</option>
            <option value="카페모카" data-price="4500">카페모카 4,500원</option>
            <option value="바닐라라떼" data-price="4500">바닐라라떼 4,500원</option>
            <option value="녹차라떼" data-price="4500">녹차라떼 4,500원</option>
            <option value="카라멜마끼아또" data-price="5000">카라멜마끼아또 5,000원</option>
            <option value="딸기라떼" data-price="5000">딸기라떼 5,000원</option>
          </select>
        </div>

        <!-- 사이즈 선택 -->
        <fieldset>
          <legend>사이즈</legend>
          <div>
            <input type="radio" id="size-s" name="size" value="S" data-price="0">
            <label for="size-s">S +0원</label>
          </div>
          <div>
            <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
            <label for="size-m">M +500원</label>
          </div>
          <div>
            <input type="radio" id="size-l" name="size" value="L" data-price="1000">
            <label for="size-l">L +1,000원</label>
          </div>
        </fieldset>

        <!-- 추가 옵션 선택 -->
        <fieldset>
          <legend>추가 옵션</legend>
          <div>
            <input type="checkbox" id="option-shot" name="options" value="샷 추가" data-price="500">
            <label for="option-shot">샷 추가 +500원</label>
          </div>
          <div>
            <input type="checkbox" id="option-cream" name="options" value="크림 추가" data-price="500">
            <label for="option-cream">크림 추가 +500원</label>
          </div>
          <div>
            <input type="checkbox" id="option-syrup" name="options" value="시럽 추가" data-price="300">
            <label for="option-syrup">시럽 추가 +300원</label>
          </div>
          <div>
            <input type="checkbox" id="option-decaf" name="options" value="디카페인" data-price="0">
            <label for="option-decaf">디카페인 +0원</label>
          </div>
        </fieldset>

        <div>
          <label for="quantity">수량</label>
          <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
        </div>

        <div>
          <label for="request">요청사항</label>
          <textarea id="request" name="request"></textarea>
        </div>

        <!-- 예상 금액 및 주문 버튼 -->
        <p id="estimated-price">예상 금액: 0원</p>
        <button type="submit">주문하기</button>
        <button type="reset">다시 작성</button>
      </form>

      <!-- 주문 확인 메시지 영역 -->
      <div id="order-confirmation" class="hidden" aria-live="polite"></div>
    </section>

    <section
      id="history-panel"
      class="hidden"
      role="tabpanel"
      aria-labelledby="history-tab"
    >
      <div id="orders-list" aria-live="polite"></div>
      <div id="orders-summary" class="orders-summary hidden">
        <p id="orders-total">총 주문 금액: 0원 (0건)</p>
        <button type="button" id="clear-orders">내역 모두 지우기</button>
      </div>
    </section>
  </main>
</body>
</html>
